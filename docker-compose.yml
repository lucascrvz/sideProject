version: "3.9"

services:
  db:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sideproject
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: sideproject-backend
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=sideproject;Username=postgres;Password=postgres
      - DOTNET_ENVIRONMENT=Development
    depends_on:
      - db
    ports:
      - "5000:8080"

  frontend:
    image: node:20-alpine
    container_name: sideproject-frontend
    working_dir: /usr/src/app
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_WEBPACK_USEPOLLING=1
      - WDS_SOCKET_PORT=0
      - NEXT_DISABLE_TURBOPACK=1
    volumes:
      - ./frontend/gestiongastos:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm ci --no-audit --no-fund || npm install --no-audit --no-fund && npm run dev"
    depends_on:
      - backend

volumes:
  postgres_data:
